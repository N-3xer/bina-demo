<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Bina favicon">
  <title>Bina</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5BB77D" />
      <stop offset="1" stop-color="#3E8E5F" />
    </linearGradient>
  </defs>
  <!-- rounded nametag shape -->
  <rect x="6" y="34" width="116" height="60" rx="14" ry="14" fill="url(#g)" />
  <!-- subtle border -->
  <rect x="6" y="34" width="116" height="60" rx="14" ry="14" fill="none" stroke="#D4E8DA" stroke-width="1.5" opacity="0.4" />
  <!-- Bina wordmark -->
  <text x="64" y="74" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Bina</text>
</svg>
